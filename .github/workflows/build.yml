name: Build OpenThread RCP for Pro Micro

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Zephyr derleme ortamı ve ARM Toolchain kurulumu (Klasör takibini serbest bıraktık)
      - name: Setup Zephyr Project Environment
        uses: zephyrproject-rtos/action-zephyr-setup@v1
        with:
          toolchains: arm-zephyr-eabi

      # 2. Zephyr ve Bağımlılıkların İndirilmesi
      - name: Initialize West and Dependencies
        run: |
          west init -m https://github.com --mr v3.6.0
          west update
          west zephyr-export

      # 3. Pro Micro nRF52840 için RCP Uygulaması Derleme Komutu
      - name: Run West Build
        run: |
          west build -p always -b promicro_nrf52840 zephyr/samples/net/openthread/coprocessor -- \
            -DCONFIG_BUILD_OUTPUT_UF2=y \
            -DCONFIG_OPENTHREAD_NORDIC_LIBRARY_MASTER=y \
            -DCONF_FILE="${GITHUB_WORKSPACE}/coprocessor/prj.conf" \
            -DDTC_OVERLAY_FILE="${GITHUB_WORKSPACE}/coprocessor/boards/promicro_nrf52840.overlay"

      # 4. Üretilen .uf2 firmware dosyasının yüklenmesi
      - name: Upload UF2 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ProMicro-OpenThread-RCP-Firmware
          path: build/zephyr/zephyr.uf2
